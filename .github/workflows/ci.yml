name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: motorcycle_parts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d motorcycle_parts"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motorcycle_parts
      JWT_SECRET: ci-only-throwaway-value-not-used-outside-continuous-integration
      JWT_EXPIRATION: 24h
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # Proves the migration path works from an empty database — the gap that
      # let the schema drift away from migrations in the first place.
      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Fail if the schema has drifted from the migrations
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel ./prisma/schema.prisma \
            --exit-code

      - name: Seed
        working-directory: apps/api
        run: npx prisma db seed

      - name: Typecheck
        run: |
          cd apps/api && npx tsc --noEmit
          cd ../web && npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/api
        run: npx jest --ci

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: apps/api
        run: |
          node dist/src/main &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/api/docs >/dev/null && break
            sleep 2
          done

      - name: Start web
        working-directory: apps/web
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null && break
            sleep 2
          done

      - name: End-to-end tests
        working-directory: apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
