name: CI

on:
  push:
    # `dev` is where work lands (CLAUDE.md §14). Running here means the full
    # suite runs on GitHub after every merge, instead of an agent re-running
    # it locally; a red run is what brings an agent in.
    branches: [master, main, dev]
  pull_request:

# A newer push to the same branch makes the older run worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs move with the code (.claude/LEARNINGS.md, "Documentation"). An agent
  # remembering that is not a check; this is. It warns rather than fails, since
  # a refactor or a test-only change legitimately leaves the rules alone.
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when code changed and the business docs did not
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare with (new branch); skipped."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          code=$(echo "$changed" | grep -E '^apps/(api/src/modules|api/prisma|web/app|storefront/app)/' | grep -vE '\.spec\.ts$' || true)
          docs=$(echo "$changed" | grep -E '^docs/(BUSINESS_LOGIC\.md|business/)' || true)
          if [ -n "$code" ] && [ -z "$docs" ]; then
            echo "::warning title=Docs not updated::Code changed but nothing under docs/BUSINESS_LOGIC.md or docs/business/ did. If a rule or behaviour changed, the docs should say so."
            echo "$code"
          else
            echo "Docs in step with the code."
          fi

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: motorcycle_parts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d motorcycle_parts"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motorcycle_parts
      JWT_SECRET: ci-only-throwaway-value-not-used-outside-continuous-integration
      JWT_EXPIRATION: 24h
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      # The specs call the cron endpoints with CRON_SECRET (default
      # local-cron-secret); an API with none set refuses: CRON_NOT_CONFIGURED.
      CRON_SECRET: local-cron-secret
      # The business runs on Cairo time and so does every developer machine.
      # On UTC, between Cairo's midnight and UTC's, the API, the browser and
      # the specs disagreed about which day "today" is.
      TZ: Africa/Cairo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/storefront/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # The storefront project in playwright.config.ts opens STORE_URL
      # (localhost:3002); nothing started it here, so those specs had no app.
      - name: Install storefront dependencies
        working-directory: apps/storefront
        run: npm ci

      # Proves the migration path works from an empty database — the gap that
      # let the schema drift away from migrations in the first place.
      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Fail if the schema has drifted from the migrations
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel ./prisma/schema.prisma \
            --exit-code

      - name: Seed
        working-directory: apps/api
        run: npx prisma db seed

      - name: Typecheck
        run: |
          cd apps/api && npx tsc --noEmit
          cd ../web && npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/api
        run: npx jest --ci

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build web
        working-directory: apps/web
        # next/font downloads the Google fonts at build time, and that download
        # fails now and then on the runner ("next/font/google queries have
        # exactly one entry"; runs 41469815925, 41543823071). One retry.
        run: npm run build || { echo "::warning::build failed, retrying once in 60s (Google Fonts download)"; sleep 60; npm run build; }

      - name: Build storefront
        working-directory: apps/storefront
        # next/font downloads the Google fonts at build time, and that download
        # fails now and then on the runner ("next/font/google queries have
        # exactly one entry"; runs 41469815925, 41543823071). One retry.
        run: npm run build || { echo "::warning::build failed, retrying once in 60s (Google Fonts download)"; sleep 60; npm run build; }

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: apps/api
        run: |
          node dist/src/main &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/api/docs >/dev/null && break
            sleep 2
          done

      # The job's PORT=3001 is the API's; `next start` reads PORT too, so
      # without -p the web app tried 3001, collided with the API and exited,
      # and every page test failed on a refused connection to 3000.
      - name: Start web
        working-directory: apps/web
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null && break
            sleep 2
          done

      - name: Start storefront
        working-directory: apps/storefront
        run: |
          npx next start -p 3002 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3002 >/dev/null && break
            sleep 2
          done

      # The e2e setup snapshots and reseeds through `docker exec` on
      # DB_CONTAINER (tests/support/env.ts), `motorcycle_parts_db` on a
      # developer's machine; GitHub names the service container itself, so the
      # suite stopped before any test ran. Hand it the service's real id.
      - name: Name the database container for the e2e setup
        run: echo "DB_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: End-to-end tests
        id: e2e
        working-directory: apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      # Visual regression (apps/web/tests/visual*.spec.ts). The e2e run above
      # needs the real clock, the visual one a frozen API clock, so the API is
      # restarted at FROZEN_NOW in between (scripts/lib/fixed-clock.cjs).
      - name: Restart the API at the visual specs' frozen clock
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        working-directory: apps/api
        run: |
          kill "$(cat "$RUNNER_TEMP/api.pid")"
          sleep 2
          NODE_OPTIONS="--require $GITHUB_WORKSPACE/scripts/lib/fixed-clock.cjs" \
            FIXED_CLOCK=2026-11-01T08:00:00Z node dist/src/main &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/api/docs >/dev/null && break
            sleep 2
          done

      # Baselines are per OS (-darwin from a Mac, -linux here). A screen with
      # no -linux baseline (the first run, a new screen, or one whose PNG was
      # deleted after a deliberate change) gets one taken now; the new files
      # are uploaded as visual-baselines-linux to be looked at and committed.
      # Every other screen is compared.
      - name: Visual regression
        id: visual
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        working-directory: apps/web
        run: VISUAL=1 npx playwright test tests/visual.spec.ts tests/visual-storefront.spec.ts --update-snapshots=missing --output=visual-results

      - name: Collect new Linux baselines
        id: baselines
        if: ${{ !cancelled() && steps.visual.outcome != 'skipped' }}
        run: |
          new=$(git ls-files --others --exclude-standard -- 'apps/web/tests/*-snapshots/*-linux.png')
          if [ -n "$new" ]; then
            mkdir -p "$RUNNER_TEMP/baselines"
            echo "$new" | while read -r f; do mkdir -p "$RUNNER_TEMP/baselines/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/baselines/$f"; done
            echo "made=1" >> "$GITHUB_OUTPUT"
            echo "::warning title=New Linux visual baselines::$(echo "$new" | wc -l | tr -d ' ') taken; download visual-baselines-linux, look at them, and commit them."
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.baselines.outputs.made == '1' }}
        with:
          name: visual-baselines-linux
          path: ${{ runner.temp }}/baselines/
          retention-days: 7

      # On a failed comparison: expected, actual and the diff for each screen.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.visual.conclusion == 'failure'
        with:
          name: visual-diffs
          path: apps/web/visual-results/
          retention-days: 7
