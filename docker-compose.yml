services:
  postgres:
    image: postgres:16-alpine
    container_name: motorcycle_parts_db
    # Started by scripts/dev.sh (docker compose up -d), never by Docker opening for another project.
    restart: "no"
    environment:
      POSTGRES_DB: motorcycle_parts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motorcycle_parts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
